{% extends "base.html" %}
{% block content %}
<div class="glass fade-in" style="padding: 3rem; max-width: 400px;">
    <h2 class="text-center" style="margin-bottom: 2.5rem; font-size: 2rem;">로그인 / 회원가입</h2>
    
    <form method="POST" action="/login" style="display: flex; flex-direction: column; gap: 1.2rem;">
        <div>
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-sub);">아이디</label>
            <input type="text" name="user_id" placeholder="아이디를 입력하세요" required>
        </div>
        <div>
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-sub);">비밀번호 (가입시 최소 8자리)</label>
            <input type="password" name="password" placeholder="비밀번호를 입력하세요" required>
        </div>
        
        {% if error %}
        <div style="color: var(--error); font-size: 0.9rem; text-align: center; margin-top: 0.5rem;">{{ error }}</div>
        {% endif %}
        
        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" name="action" value="login" class="btn btn-outline" style="flex: 1;">로그인</button>
            <button type="submit" name="action" value="signup" class="btn btn-primary" style="flex: 1;">회원가입</button>
        </div>
    </form>
    
    <div class="text-center mt-2">
        <a href="/" class="btn btn-outline w-100">메인으로 돌아가기</a>
    </div>
</div>
{% endblock %}
